# Weft web container: static SPA under /, the API under /api on the same origin.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Docker's DNS, re-resolved so an API container restart (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $weft_api http://api:8000;

    location /api/ {
        proxy_pass $weft_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ask / extraction call the LLM synchronously on some routes.
        proxy_read_timeout 180s;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must never be cached across deploys.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
